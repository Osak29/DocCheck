version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: doccheck
      POSTGRES_PASSWORD: doccheck
      POSTGRES_DB: doccheck
    ports:
      - "5432:5432"
    volumes:
      - doccheck_pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg2://doccheck:doccheck@db:5432/doccheck
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    ports:
      - "8000:8000"
    depends_on:
      - db

  worker:
    build: .
    command: python -m app.tasks --daemon
    environment:
      DATABASE_URL: postgresql+psycopg2://doccheck:doccheck@db:5432/doccheck
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - db

  dashboard:
    build: .
    command: streamlit run dashboard/streamlit_app.py --server.address 0.0.0.0
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  doccheck_pgdata:
